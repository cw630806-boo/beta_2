<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل السلسلة — احمد زروال</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C08A34">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="course-detail-page">
  <div class="wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;">
      <a href="index.html" class="back-btn" style="margin-bottom:0;">← العودة إلى الصفحة الرئيسية</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل الوضع الليلي/النهاري"></button>
    </div>

    <div id="courseContent">
      <div style="text-align:center;padding:3rem 0;color:var(--chalk-dim);">جار تحميل السلسلة...</div>
    </div>
  </div>
</div>

<div class="video-modal" id="videoModal" style="display:none;">
  <div class="video-modal__box">
    <button class="video-modal__close" id="modalClose" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
    <h3 id="modalTitle">عنوان الفيديو</h3>
    <div class="video-modal__player" id="modalPlayer"></div>
  </div>
</div>

<!-- Toast: يبدل window.alert() -->
<div id="appToast"></div>

<script type="module">
import { db } from './firebase-init.js';
import {
  doc, getDoc, collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let toastTimer = null;
function showToast(message, { error = false, duration = 3000 } = {}) {
  const el = document.getElementById('appToast');
  if (!el) { console.log(message); return; }
  el.textContent = message;
  el.classList.toggle('is-error', error);
  el.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-visible'), duration);
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getYoutubeEmbedUrl(url) {
  if (!url) return '';
  if (url.includes('/embed/')) return url;
  const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube-nocookie\.com\/embed\/)([\w-]{11})/);
  return match ? `https://www.youtube-nocookie.com/embed/${match[1]}` : url;
}

const modal = document.getElementById('videoModal');
const modalPlayer = document.getElementById('modalPlayer');
const modalTitle = document.getElementById('modalTitle');
const modalClose = document.getElementById('modalClose');

function openVideoModal(title, embedUrl) {
  modalTitle.textContent = title;
  const finalUrl = getYoutubeEmbedUrl(embedUrl);
  modalPlayer.innerHTML = `<iframe src="${finalUrl}" allowfullscreen style="width:100%;height:100%;border:0;border-radius:4px;"></iframe>`;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeVideoModal() {
  modal.style.display = 'none';
  document.body.style.overflow = '';
  modalPlayer.innerHTML = '';
}
modalClose.addEventListener('click', closeVideoModal);
modal.addEventListener('click', e => { if (e.target === modal) closeVideoModal(); });

const container = document.getElementById('courseContent');
const params = new URLSearchParams(window.location.search);
const courseId = params.get('id');

if (!courseId) {
  container.innerHTML = '<p style="text-align:center;color:var(--blood);">معرف الدورة غير موجود.</p>';
} else {
  try {
    const docSnap = await getDoc(doc(db, 'courses', courseId));
    if (!docSnap.exists()) {
      container.innerHTML = '<p style="text-align:center;color:var(--blood);">الدورة غير موجودة.</p>';
    } else {
      const course = docSnap.data();
      const isFree = course.free === true;

      let html = `
        <div class="course-header">
          <div class="eyebrow-mark"><span></span><span></span></div>
          <h1>${escapeHtml(course.title)}</h1>
          <p style="color:var(--chalk-dim);margin-top:.5rem;">${escapeHtml(course.desc)}</p>
          <div class="meta">
            <span class="price">${escapeHtml(course.price)}</span>
            ${isFree ? '<span class="free-badge">مجانية</span>' : ''}
            ${course.discount ? `<span class="discount-badge">${escapeHtml(course.discount)}</span>` : ''}
            ${course.incomplete ? '<span class="incomplete-badge">⏳ قيد الإكمال</span>' : ''}
          </div>
        </div>
        <div id="videosContainer"></div>
      `;
      container.innerHTML = html;

      if (course.incomplete) {
        document.getElementById('videosContainer').insertAdjacentHTML('beforebegin',
          '<div class="incomplete-notice">⏳ هذه السلسلة لا تزال قيد الإكمال من طرف المدرب، سيتم إضافة فيديوهات جديدة تباعاً.</div>');
      }

      const q = query(collection(db, 'courseVideos'), where('courseId', '==', courseId));
      const snap = await getDocs(q);
      const videos = [];
      snap.forEach(d => videos.push({ id: d.id, ...d.data() }));

      const videosContainer = document.getElementById('videosContainer');

      if (videos.length === 0) {
        videosContainer.innerHTML = '<p style="color:var(--chalk-dim);">لا توجد فيديوهات لهذه الدورة بعد.</p>';
      } else {
        let videosHtml = '<div class="videos-grid">';
        videos.forEach(v => {
          const embed = v.embed || '';
          const thumbHtml = embed ? `<iframe src="${escapeHtml(embed)}" allowfullscreen loading="lazy"></iframe>` : '<div style="display:flex;align-items:center;justify-content:center;color:var(--chalk-dim);font-size:.8rem;">لا يوجد معاينة</div>';
          videosHtml += `
            <div class="video-item" data-embed="${escapeHtml(embed)}" data-title="${escapeHtml(v.title)}">
              <div class="thumb">${thumbHtml}</div>
              <div class="info">
                <h4>${escapeHtml(v.title)}</h4>
                ${isFree ? '' : '<div class="lock">🔒 هذا الفيديو مدفوع، ميزة الدفع لم تضاف بعد.</div>'}
              </div>
            </div>
          `;
        });
        videosHtml += '</div>';
        videosContainer.innerHTML = videosHtml;

        if (!isFree) {
          videosContainer.innerHTML += `
            <div class="paid-notice">
              ⚠️ ميزة الدفع لم تضاف بعد، سيتم تفعيل المشاهدة قريباً.
            </div>
          `;
        }

        const items = document.querySelectorAll('.video-item');
        items.forEach(item => {
          item.addEventListener('click', () => {
            if (isFree) {
              const embed = item.dataset.embed;
              const title = item.dataset.title;
              if (embed) openVideoModal(title, embed);
            } else {
              showToast('⚠️ هذه الدورة مدفوعة، ميزة الدفع لم تضاف بعد.');
            }
          });
        });
      }
    }
  } catch (err) {
    container.innerHTML = `<p style="text-align:center;color:var(--blood);">حدث خطأ: ${err.message}</p>`;
    console.error(err);
  }
}
</script>

</body>
</html>
